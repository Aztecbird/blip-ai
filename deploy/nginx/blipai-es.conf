limit_req_zone $binary_remote_addr zone=blip_api:10m rate=10r/s;
map "$request_method:$http_origin" $blip_csrf_block {
    default 1;
    ~^(GET|HEAD|OPTIONS): 0;
    ~^(POST|PUT|PATCH|DELETE):https://(www\.)?blipai\.es$ 0;
}

server {
    server_name blipai.es www.blipai.es;

    root /var/www/blipai-es;
    index index.html;

    # Blip is currently a private prototype with access to personal accounts.
    # Keep both the app and its APIs behind one browser-level login.
    auth_basic "Private Blip";
    auth_basic_user_file /etc/nginx/.htpasswd-blip;

    client_max_body_size 25m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    if ($blip_csrf_block) {
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/google-calendar/ {
        limit_req zone=blip_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/gmail/ {
        limit_req zone=blip_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/telegram/ {
        limit_req zone=blip_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/openai-image/ {
        limit_req zone=blip_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/media-actions/ {
        limit_req zone=blip_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/weather/ {
        limit_req zone=blip_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/gemini/ {
        limit_req zone=blip_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8793;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/blipai.es/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blipai.es/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.blipai.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = blipai.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name blipai.es www.blipai.es;
    return 404; # managed by Certbot
}
