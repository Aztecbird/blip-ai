server {
    server_name blipai.es www.blipai.es;

    root /var/www/blipai-es;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/google-calendar/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    location /api/gmail/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }

    location /api/telegram/ {
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
    }

    location /api/openai-image/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
    }

    location /api/media-actions/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
    }

    location /api/weather/ {
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
    }

    location /api/gemini/ {
        proxy_pass http://127.0.0.1:8793;
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/blipai.es/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blipai.es/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.blipai.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = blipai.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name blipai.es www.blipai.es;
    return 404; # managed by Certbot
}
