version: '3.8'

# This file tells Docker to spin up all 6 of Blip's backend microservices simultaneously.
# It reads directly from your .env.local file so all API keys securely pass through automatically!

services:
  gmail:
    build: .
    command: npm run dev:gmail-backend
    ports:
      - "127.0.0.1:${GOOGLE_GMAIL_BACKEND_PORT:-8788}:${GOOGLE_GMAIL_BACKEND_PORT:-8788}"
    environment:
      BLIP_BACKEND_HOST: 0.0.0.0
    env_file:
      - .env.local
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  calendar:
    build: .
    command: npm run dev:calendar-backend
    ports:
      - "127.0.0.1:${GOOGLE_CALENDAR_BACKEND_PORT:-8787}:${GOOGLE_CALENDAR_BACKEND_PORT:-8787}"
    environment:
      BLIP_BACKEND_HOST: 0.0.0.0
    env_file:
      - .env.local
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  weather:
    build: .
    command: npm run dev:weather-backend
    ports:
      - "127.0.0.1:${WEATHER_BACKEND_PORT:-8792}:${WEATHER_BACKEND_PORT:-8792}"
    environment:
      BLIP_BACKEND_HOST: 0.0.0.0
    env_file:
      - .env.local
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  telegram:
    build: .
    command: npm run dev:telegram-backend
    ports:
      - "127.0.0.1:${TELEGRAM_BACKEND_PORT:-8789}:${TELEGRAM_BACKEND_PORT:-8789}"
    environment:
      BLIP_BACKEND_HOST: 0.0.0.0
    env_file:
      - .env.local
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  media:
    build: .
    command: npm run dev:media-backend
    ports:
      - "127.0.0.1:${MEDIA_ACTIONS_BACKEND_PORT:-8791}:${MEDIA_ACTIONS_BACKEND_PORT:-8791}"
    environment:
      BLIP_BACKEND_HOST: 0.0.0.0
    env_file:
      - .env.local
    restart: unless-stopped

  openai-image:
    build: .
    command: npm run dev:openai-image-backend
    ports:
      - "127.0.0.1:${OPENAI_IMAGE_BACKEND_PORT:-8790}:${OPENAI_IMAGE_BACKEND_PORT:-8790}"
    environment:
      BLIP_BACKEND_HOST: 0.0.0.0
    env_file:
      - .env.local
    restart: unless-stopped

  gemini:
    build: .
    command: npm run dev:gemini-backend
    ports:
      - "127.0.0.1:${GEMINI_BACKEND_PORT:-8793}:${GEMINI_BACKEND_PORT:-8793}"
    environment:
      BLIP_BACKEND_HOST: 0.0.0.0
    env_file:
      - .env.local
    restart: unless-stopped
